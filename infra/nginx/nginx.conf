# NGINX — reverse proxy и единая точка входа в dev-стек.
#
# Клиент обращается только к NGINX:
#   /api/* — запросы к backend
#   /*     — запросы к Next.js frontend
#
# NGINX принимает HTTP-запрос и передаёт его нужному контейнеру.
events {}

http {
    # upstream — именованная группа backend-серверов.
    #
    # Внутри Docker Compose имя сервиса становится DNS-именем.
    # Поэтому authservice:8080 означает контейнер authservice и его порт 8080.
    # Сейчас в каждой группе по одному серверу, но позже сюда можно добавить
    # несколько экземпляров для распределения нагрузки.
    upstream authservice {
        server authservice:8080;
    }

    upstream frontend {
        server frontend:3000;
    }

    # server — виртуальный HTTP-сервер NGINX.
    # Он описывает, на каком порту и для какого host обрабатывать запросы.
    # В этом dev-стеке NGINX слушает порт 80 и является внешней точкой входа.
    server {
        listen 80;
        server_name localhost;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # location — правило маршрутизации по URL-пути.
        # NGINX выбирает наиболее подходящий location и передаёт запрос
        # указанному proxy_pass.
        location /api/ {
            rewrite ^/api/?(.*)$ /$1 break;

            proxy_pass http://authservice;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # Все остальные пути отправляются во frontend.
        # Это также позволяет передавать WebSocket-соединение для HMR.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

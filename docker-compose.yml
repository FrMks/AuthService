services:
  postgres:
    image: postgres:17-alpine
    container_name: authservice-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - authservice-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    image: authservice-backend
    container_name: authservice-migrations
    entrypoint: ["/app/efbundle"]
    command:
      - "--connection"
      - "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  authservice:
    build:
      context: .
      dockerfile: Dockerfile.backend
      secrets:
        - github_pat
        - github_user
    image: authservice-backend
    container_name: authservice-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AuthDbConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: authservice-frontend
    environment:
      NODE_ENV: development
    expose:
      - "3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    command:
      - npm
      - run
      - dev
      - --
      - --hostname
      - 0.0.0.0
    depends_on:
      - authservice

  nginx:
    image: nginx:alpine
    container_name: authservice-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - authservice
      - frontend

volumes:
  authservice-postgres-data:

secrets:
  github_pat:
    environment: GITHUB_PAT
  github_user:
    environment: GITHUB_USER
